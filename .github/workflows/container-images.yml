name: Container images

on:
  pull_request:
    paths:
      - "docker/**"
      - "web/Dockerfile"
      - "scheduler/Dockerfile"
      - ".github/workflows/container-images.yml"
  push:
    branches: [master]
    paths:
      - "docker/**"
      - "web/Dockerfile"
      - "scheduler/Dockerfile"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webserver
            dockerfile: web/Dockerfile
            image: opencve-webserver
          - name: airflow
            dockerfile: scheduler/Dockerfile
            image: opencve-airflow
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            OPENCVE_REPOSITORY=https://github.com/opencve/opencve.git
            OPENCVE_VERSION=v3.1.0
            GUNICORN_CMD_ARGS=--workers 1 --threads 2 --access-logfile '-'
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  promote:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the complete image set
        run: |
          for image in opencve-webserver opencve-airflow; do
            source="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:sha-${GITHUB_SHA}"
            docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:v3.1.0" \
              --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:latest" \
              "$source"
          done
